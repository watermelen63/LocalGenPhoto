<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單次圖片生成</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #faf6f0;
            --bg-sidebar: #dbcab5;
            --bg-card: #ffffff;
            --primary: #5c341a;
            --text-main: #1f140c;
            --text-muted: #5e4d40;
            --border: #b59f88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-dark);
            color: var(--text-main);
        }

        button {
            font: inherit;
        }

        /* =========================
           側邊欄
        ========================= */

        #sidebar {
            flex: 0 0 260px;
            width: 260px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            transition: margin-left 0.3s ease, transform 0.3s ease;
            z-index: 100;
        }

        #sidebar.collapsed {
            margin-left: -260px;
        }

        .gallery-button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .gallery-button:hover {
            background: #eee2d4;
        }

        .creation-history {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px 16px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .history-item:hover,
        .history-item.active {
            background: var(--bg-card);
            color: var(--text-main);
        }

       .history-title {
    display: flex;
    align-items: center;
    flex: 1;
    min-width: 0;
    gap: 8px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
}

/* 正在重新命名時，取消省略號 */
.history-title.editing {
    overflow: visible;
    text-overflow: clip;
}

        .history-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .history-actions button {
            display: none;
            padding: 4px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }

        .history-item:hover .history-actions button,
        .history-item:focus-within .history-actions button {
            display: inline-flex;
        }

        .history-actions button:hover {
            color: var(--primary);
        }

        .sidebar-bottom {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }

        .gallery-button {
            justify-content: flex-start;
        }

        .gallery-button i {
            color: var(--primary);
        }

        .menu-toggle {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* =========================
           主要頁面共用
        ========================= */

        #single-create-view,
        #gallery-view {
            display: none;
            flex: 1;
            min-width: 0;
            height: 100vh;
            overflow: hidden;
        }

        #single-create-view.active {
            display: flex;
            flex-direction: column;
        }

        #gallery-view.active {
            display: flex;
            flex-direction: column;
        }

        /* =========================
           單次生成頁面
        ========================= */

        .creation-header {
            min-height: 68px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 24px;
            border-bottom: 1px solid var(--border);
        }

        .creation-header-title {
            flex: 1;
            min-width: 0;
        }

        .creation-eyebrow,
        .panel-eyebrow {
            display: block;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .creation-header-title h1 {
            margin-top: 3px;
            font-size: 19px;
        }

        .single-workspace {
            display: grid;
            grid-template-columns: minmax(300px, 370px) minmax(0, 1fr);
            gap: 20px;
            flex: 1;
            min-height: 0;
            padding: 20px;
            overflow-y: auto;
        }

        .creation-settings-panel,
        .preview-panel {
            min-width: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .creation-settings-panel {
            padding: 22px;
            overflow-y: auto;
        }

        .panel-intro {
            margin-bottom: 24px;
        }

        .panel-intro h2,
        .preview-heading h2 {
            margin-top: 6px;
            font-size: 20px;
        }

        .panel-intro p {
            margin-top: 7px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .field-group > label {
            font-size: 14px;
            font-weight: 600;
        }

        #single-create-view textarea {
            width: 100%;
            min-height: 45px;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        #single-create-view textarea:focus,
        #single-create-view select:focus {
            border-color: var(--primary);
        }

        #single-create-view textarea::placeholder {
            color: #9a8b7e;
        }

        .field-hint {
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.5;
        }

        .control-select {
            width: 100%;
            padding: 11px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .ratio-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .ratio-option {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px 4px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
        }

        .ratio-option input {
            accent-color: var(--primary);
        }

        .ratio-option:has(input:checked) {
            background: #eee2d4;
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 700;
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        .upload-dropzone {
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 16px;
            background: var(--bg-dark);
            border: 1px dashed var(--border);
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .upload-dropzone:hover {
            background: #eee2d4;
        }

        .upload-dropzone i {
            color: var(--primary);
            font-size: 24px;
        }

        .upload-dropzone span {
            font-size: 13px;
            font-weight: 600;
        }

        .upload-dropzone small {
            font-size: 11px;
        }

        .reference-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .reference-preview[hidden] {
            display: none;
        }

        .reference-preview img {
            width: 58px;
            height: 58px;
            object-fit: cover;
            border-radius: 6px;
        }

        .reference-file-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .reference-file-info span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
        }

        .reference-file-info button {
            align-self: flex-start;
            padding: 3px 8px;
            background: transparent;
            border: none;
            color: #a33;
            cursor: pointer;
        }

        .btn-generate {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            background: var(--primary);
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-generate:hover {
            opacity: 0.88;
        }

        .creation-status {
            margin-top: 12px;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .preview-panel {
            display: flex;
            flex-direction: column;
            padding: 22px;
        }

        .preview-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .preview-state {
            padding: 6px 10px;
            background: var(--bg-dark);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .preview-canvas {
            flex: 1;
            min-height: 420px;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(145deg, #ffffff, #faf6f0);
            border: 1px dashed var(--border);
            border-radius: 12px;
        }

        .preview-empty-state {
            max-width: 350px;
            text-align: center;
        }

        .preview-icon {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            background: #eee2d4;
            border-radius: 20px;
            color: var(--primary);
            font-size: 30px;
        }

        .preview-empty-state h3 {
            margin-bottom: 9px;
            font-size: 17px;
        }

        .preview-empty-state p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .preview-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* =========================
           圖庫頁面
        ========================= */

        .gallery-page {
            padding: 30px;
            overflow-y: auto !important;
            gap: 24px;
        }

        .gallery-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }
        .gallery-title-area {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.gallery-title-area h1 {
    margin-top: 5px;
}
        .gallery-header h1 {
            margin-top: 5px;
            font-size: 24px;
        }

        .gallery-search-wrapper {
            position: relative;
            width: min(100%, 340px);
        }

        .gallery-search-wrapper i {
            position: absolute;
            top: 50%;
            left: 13px;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .gallery-search-wrapper input {
            width: 100%;
            padding: 11px 14px 11px 38px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
        }

        .gallery-search-wrapper input:focus {
            border-color: var(--primary);
        }

        .gallery-description {
            color: var(--text-muted);
            font-size: 13px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
            align-content: start;
        }

        .gallery-card {
            min-width: 0;
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .gallery-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.08);
        }

        .gallery-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #eee2d4;
        }

        .gallery-info {
            padding: 12px;
        }

        .gallery-info strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
        }

        .gallery-info p {
            margin-top: 6px;
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .gallery-date {
            display: block;
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .gallery-empty {
            grid-column: 1 / -1;
            padding: 70px 20px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.8;
        }

        .gallery-empty i {
            display: block;
            margin-bottom: 15px;
            color: var(--border);
            font-size: 42px;
        }
.history-title-input {
    flex: 1;
    min-width: 0;
    width: 100%;
    box-sizing: border-box;

    padding: 4px 6px;

    border: 1px solid #6366f1;
    border-radius: 6px;

    background: #ffffff !important;

    color: #222222 !important;
    -webkit-text-fill-color: #222222 !important;
    -webkit-text-security: none !important;

    font-family: Arial, sans-serif !important;
    font-size: 14px;
    font-weight: normal;

    letter-spacing: normal;
    text-overflow: clip;
    caret-color: #222222;

    opacity: 1;
    outline: none;
}

.history-title-input:focus {
    border-color: #6366f1;
}


        /* =========================
           響應式設計
        ========================= */

        @media (max-width: 1050px) {
            .single-workspace {
                grid-template-columns: minmax(0, 1fr);
            }

            .preview-canvas {
                min-height: 350px;
            }
        }

        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                transform: translateX(-100%);
                margin-left: 0;
            }

            #sidebar.active {
                transform: translateX(0);
            }

            #sidebar.collapsed {
                margin-left: 0;
            }

            .creation-header {
                padding: 10px 14px;
            }

            .creation-header-title h1 {
                font-size: 16px;
            }

            .single-workspace {
                padding: 12px;
                gap: 14px;
            }

            .creation-settings-panel,
            .preview-panel {
                padding: 16px;
            }

            .preview-canvas {
                min-height: 280px;
            }

            .gallery-page {
                padding: 18px;
            }

            .gallery-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .gallery-search-wrapper {
                width: 100%;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         左側側邊欄
    ========================= -->

    <div id="sidebar">

        <!-- 歷史紀錄永遠留在側邊欄 -->

        <div class="creation-history" id="creation-history"></div>

        <!-- 圖庫按鈕 -->

        <div class="sidebar-bottom">
            <button id="gallery-button" class="gallery-button">
                <i class="fas fa-images"></i>
                <span>圖庫</span>
            </button>
        </div>

    </div>
    <!-- sidebar 到此結束 -->

    <!-- =========================
         單次圖片生成頁面
    ========================= -->

    <section id="single-create-view">

        <header class="creation-header">

            <button class="menu-toggle"
                    id="btn-toggle-sidebar-create"
                    type="button"
                    title="切換側邊欄">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="creation-header-title">
                <span class="creation-eyebrow">IMAGE STUDIO</span>
                <h1>單次圖片生成</h1>
            </div>

        </header>

        <div class="single-workspace">

            <!-- 左側生成設定 -->

            <aside class="creation-settings-panel">

                <form id="single-create-form">

                    <div class="panel-intro">
                        <span class="panel-eyebrow">CONFIGURATION</span>
                        <h2>生成設定</h2>
                        <p>調整你想要的圖片內容與輸出條件。</p>
                    </div>

                    <div class="field-group">
                        <label for="single-prompt">圖片提示詞</label>

                        <textarea
                            id="single-prompt"
                            rows="5"
                            placeholder="例如：一座位於森林深處的玻璃建築，陽光穿過樹葉，電影級光影效果..."
                        ></textarea>

                        <small class="field-hint">
                            描述主體、場景、光線、構圖與畫面風格。
                        </small>
                    </div>

                    <div class="field-group">
                        <label for="image-style">圖片風格</label>

                        <select id="image-style" class="control-select">
                            <option value="auto">不指定</option>
                            <option value="realistic">寫實攝影</option>
                            <option value="illustration">插畫</option>
                            <option value="anime">動漫風格</option>
                            <option value="3d">3D 立體風格</option>
                            <option value="watercolor">水彩畫</option>
                            <option value="pixel">像素藝術</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <label>圖片比例</label>

                        <div class="ratio-grid">

                            <label class="ratio-option">
                                <input type="radio" name="aspect-ratio"
                                       value="1:1" checked>
                                <span>1:1</span>
                            </label>

                            <label class="ratio-option">
                                <input type="radio" name="aspect-ratio"
                                       value="3:4">
                                <span>3:4</span>
                            </label>

                            <label class="ratio-option">
                                <input type="radio" name="aspect-ratio"
                                       value="4:3">
                                <span>4:3</span>
                            </label>

                            <label class="ratio-option">
                                <input type="radio" name="aspect-ratio"
                                       value="16:9">
                                <span>16:9</span>
                            </label>

                        </div>
                    </div>

                    <div class="field-grid">

                        <div class="field-group">
                            <label for="image-resolution">解析度</label>

                            <select id="image-resolution"
                                    class="control-select">
                                <option value="512">512</option>
                                <option value="768" selected>768</option>
                                <option value="1024">1024</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label for="image-count">生成數量</label>

                            <select id="image-count"
                                    class="control-select">
                                <option value="1">1 張</option>
                                <option value="2">2 張</option>
                                <option value="3">3 張</option>
                                <option value="4">4 張</option>
                            </select>
                        </div>

                    </div>

                    <div class="field-group">
                        <label>參考圖片（選填）</label>

                        <label for="reference-image-input"
                               class="upload-dropzone">

                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span>點擊上傳圖片</span>
                            <small>支援常見圖片格式</small>

                        </label>

                        <input
                            type="file"
                            id="reference-image-input"
                            accept="image/*"
                            class="visually-hidden"
                        >

                        <div class="reference-preview"
                             id="reference-image-wrap"
                             hidden>

                            <img id="reference-image-preview"
                                 alt="參考圖片預覽">

                            <div class="reference-file-info">
                                <span id="reference-image-name"></span>

                                <button type="button"
                                        id="remove-reference-image">
                                    移除
                                </button>
                            </div>

                        </div>
                    </div>

                    <button type="submit" class="btn-generate">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        生成圖片
                    </button>

                    <p id="single-create-status"
                       class="creation-status"
                       role="status"
                       aria-live="polite">
                        目前尚未連接圖片生成模型。
                    </p>

                </form>

            </aside>

            <!-- 右側圖片預覽 -->

            <section class="preview-panel">

                <div class="preview-heading">

                    <div>
                        <span class="panel-eyebrow">OUTPUT</span>
                        <h2>圖片預覽</h2>
                    </div>

                    <span class="preview-state" id="preview-state">
                        尚未生成
                    </span>

                </div>

                <div class="preview-canvas" id="preview-canvas">

                    <div class="preview-empty-state">

                        <div class="preview-icon">
                            <i class="fa-regular fa-image"></i>
                        </div>

                        <h3>圖片將顯示於此</h3>

                        <p>
                            請先在左側輸入提示詞，
                            並調整圖片生成設定。
                        </p>

                    </div>

                </div>

                <footer class="preview-footer">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>目前為介面原型，尚未連接圖片生成模型。</span>
                </footer>

            </section>

        </div>

    </section>

    <!-- =========================
         圖庫頁面
         與單次生成頁面同層
    ========================= -->

    <section id="gallery-view" class="gallery-page">

        
<header class="gallery-header">

    <div class="gallery-title-area">

        <button class="menu-toggle"
                id="btn-toggle-sidebar-gallery"
                type="button"
                title="切換側邊欄">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div>
            <span class="creation-eyebrow">IMAGE GALLERY</span>
            <h1>我的圖庫</h1>
        </div>

    </div>

    <div class="gallery-search-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            id="gallery-search"
            placeholder="搜尋圖片名稱或提示詞..."
        >
    </div>

</header>


        <p class="gallery-description">
            所有創作圖片都會集中顯示在這裡，最新生成的圖片會排在最前面。
        </p>

        <div id="gallery-grid" class="gallery-grid"></div>

    </section>

    <!-- =========================
         JavaScript
    ========================= -->

    <script>
        /* =========================
           1. 載入資料
        ========================= */

        function loadSingleSessions() {
            try {
                const stored = JSON.parse(
                    localStorage.getItem('gemini_chat_sessions') || '[]'
                );

                if (!Array.isArray(stored)) {
                    return [];
                }

                return stored
                    .filter(session =>
                        session && session.mode === 'single'
                    )
                    .map(session => ({
                        id: String(session.id || Date.now()),
                        mode: 'single',

                        title:
                            typeof session.title === 'string' &&
                            session.title.trim()
                                ? session.title
                                : '單次生成圖片',

                        titleEdited: Boolean(session.titleEdited),

                        createdAt:
                            Number(session.createdAt) || Date.now(),

                        promptText:
                            typeof session.promptText === 'string'
                                ? session.promptText
                                : '',

                        prompt: session.prompt || '',
                        style: session.style || '',
                        proportion: session.proportion || '',
                        resolution: session.resolution || '',
                        num: session.num || '',
                        example: session.example || '',

                        images: Array.isArray(session.images)
                            ? session.images.filter(image =>
                                image &&
                                typeof image.url === 'string' &&
                                image.url
                            )
                            : []
                    }));

            } catch (error) {
                console.warn('讀取圖片生成紀錄失敗：', error);
                return [];
            }
        }

        const state = {
            sessions: loadSingleSessions(),
            currentSessionId: null,
            searchKeyword: ''
        };

        /* =========================
           2. DOM 元素
        ========================= */

        const sidebar = document.getElementById('sidebar');

        const creationHistory =
            document.getElementById('creation-history');

        const singleCreateView =
            document.getElementById('single-create-view');

        const galleryButton =
            document.getElementById('gallery-button');

        const galleryView =
            document.getElementById('gallery-view');

        const galleryGrid =
            document.getElementById('gallery-grid');

        const gallerySearch =
            document.getElementById('gallery-search');

        const toggleSidebarButton =
            document.getElementById('btn-toggle-sidebar-create');
        const toggleSidebarGalleryButton = document.getElementById('btn-toggle-sidebar-gallery');
        const singleCreateForm =
            document.getElementById('single-create-form');

        const singlePrompt =
            document.getElementById('single-prompt');

        const referenceImageInput =
            document.getElementById('reference-image-input');

        const referenceImageWrap =
            document.getElementById('reference-image-wrap');

        const referenceImagePreview =
            document.getElementById('reference-image-preview');

        const referenceImageName =
            document.getElementById('reference-image-name');

        const removeReferenceImageButton =
            document.getElementById('remove-reference-image');

        const singleCreateStatus =
            document.getElementById('single-create-status');

        const previewState =
            document.getElementById('preview-state');

        let referenceImageObjectUrl = null;

        /* =========================
           3. 儲存資料
        ========================= */

        // 後端位址（需先啟動 Background/server.py）
        const API_BASE = 'http://127.0.0.1:8000';

        function saveState() {
            localStorage.setItem(
                'gemini_chat_sessions',
                JSON.stringify(state.sessions)
            );

            // 同步寫入 data/chat_sessions.json（後端沒開時只在主控台警告）
            fetch(`${API_BASE}/sessions`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(state.sessions)
            }).then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
            }).catch(error => {
                console.warn('無法寫入 chat_sessions.json：', error);
            });
        }

        /* =========================
           4. 取得目前創作
        ========================= */

        function getCurrentSession() {
            return state.sessions.find(
                session => session.id === state.currentSessionId
            ) || null;
        }

        /* =========================
           5. 切換頁面
        ========================= */

        function showSingleCreateView() {
            galleryView.classList.remove('active');
            singleCreateView.classList.add('active');

            if (window.innerWidth <= 768) {
                sidebar.classList.remove('active');
            }
        }

        function showGalleryView() {
            singleCreateView.classList.remove('active');
            galleryView.classList.add('active');

            renderGallery();

            if (window.innerWidth <= 768) {
                sidebar.classList.remove('active');
            }
        }

        /* =========================
           6. 建立新創作
        ========================= */

        function createNewSession() {
            const newSession = {
                id: `${Date.now()}-${Math.random()
                    .toString(36).slice(2, 8)}`,

                mode: 'single',
                title: '單次生成圖片',
                titleEdited: false,

                createdAt: Date.now(),
                prompt: '',
                style: '',
                proportion: '',
                resolution: '',
                num: '',
                example: '',
                promptText: '',
                images: []
            };

            state.sessions.unshift(newSession);
            state.currentSessionId = newSession.id;

            singlePrompt.value = '';
            singleCreateStatus.textContent =
                '目前尚未連接圖片生成模型。';

            previewState.textContent = '尚未生成';

            saveState();
            renderSidebar();

            return newSession;
        }

        /* =========================
           7. 載入指定創作
        ========================= */

        function loadSession(session) {
            state.currentSessionId = session.id;

            singlePrompt.value = session.promptText || '';

            singleCreateStatus.textContent =
                '已載入創作紀錄。';

            saveState();
            renderSidebar();
            showSingleCreateView();
        }

        /* =========================
           8. HTML 安全處理
        ========================= */

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[char]);
        }

        /* =========================
           9. 顯示歷史紀錄
        ========================= */

        function renderSidebar() {
    creationHistory.innerHTML = '';

    const keyword =
        state.searchKeyword.trim().toLowerCase();

    const filteredSessions = state.sessions.filter(session => {
        const title = session.title || '';
        const prompt = session.promptText || '';

        return `${title} ${prompt}`
            .toLowerCase()
            .includes(keyword);
    });

    if (filteredSessions.length === 0) {
        const emptyMessage = document.createElement('p');

        emptyMessage.textContent = keyword
            ? '找不到符合的創作紀錄。'
            : '目前沒有創作紀錄。';

        emptyMessage.style.padding = '12px';
        emptyMessage.style.color = 'var(--text-muted)';
        emptyMessage.style.fontSize = '12px';

        creationHistory.appendChild(emptyMessage);
        return;
    }

    filteredSessions.forEach(session => {
        const item = document.createElement('div');

        item.className = 'history-item';

        if (session.id === state.currentSessionId) {
            item.classList.add('active');
        }

        item.innerHTML = `
            <span class="history-title">
                <i class="fa-solid fa-image"></i>
                <span class="history-title-text">
                    ${escapeHtml(session.title || '')}
                </span>
            </span>

            <span class="history-actions">
                <button type="button"
                        class="rename-btn"
                        title="重新命名"
                        aria-label="重新命名">
                    <i class="fa-solid fa-pen"></i>
                </button>

                <button type="button"
                        class="delete-btn"
                        title="刪除紀錄"
                        aria-label="刪除紀錄">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </span>
        `;

        item.addEventListener('click', event => {

            /* 重新命名 */

            if (event.target.closest('.rename-btn')) {
                event.stopPropagation();

                const titleText =
                    item.querySelector('.history-title-text');
                const titleContainer =
    item.querySelector('.history-title');
                const input = document.createElement('input');

                input.type = 'text';
                input.className = 'history-title-input';
                input.value = session.title || '';
                input.placeholder = '輸入創作名稱';

                titleContainer.classList.add('editing');
titleText.replaceWith(input);

                input.focus();
                input.select();

                let finished = false;

                function finishRename(shouldSave, refreshSidebar) {
                    if (finished) return;

                    finished = true;

                    if (shouldSave) {
                        const trimmedTitle = input.value.trim();

                        if (trimmedTitle) {
                            session.title = trimmedTitle;
                            session.titleEdited = true;

                            saveState();
                            renderGallery();
                        }
                    }

                    titleText.textContent = session.title || '';
                    input.replaceWith(titleText);

                    if (refreshSidebar) {
                        renderSidebar();
                    }
                }

                // Enter：儲存名稱
                input.addEventListener('keydown', event => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        finishRename(true, true);
                    }

                    // Escape：取消修改
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        finishRename(false, true);
                    }
                });

                // 離開輸入欄位時自動儲存
                input.addEventListener('blur', () => {
                    finishRename(true, false);
                });

                return;
            }

            /* 刪除 */

            if (event.target.closest('.delete-btn')) {
                event.stopPropagation();

                deleteSession(session.id);
                return;
            }

            /* 避免點擊輸入欄位時開啟創作 */

            if (event.target.closest('.history-title-input')) {
                event.stopPropagation();
                return;
            }

            /* 開啟創作 */

            loadSession(session);
        });

        creationHistory.appendChild(item);
    });
}

        /* =========================
           10. 刪除創作
        ========================= */

        function deleteSession(id) {

    // 直接刪除創作紀錄
    state.sessions = state.sessions.filter(
        session => session.id !== id
    );

    if (state.currentSessionId === id) {
        state.currentSessionId =
            state.sessions.length > 0
                ? state.sessions[0].id
                : null;
    }

    if (!state.currentSessionId) {
        createNewSession();
    } else {
        const currentSession = getCurrentSession();

        if (currentSession) {
            singlePrompt.value =
                currentSession.promptText || '';
        }
    }

    saveState();
    renderSidebar();
    renderGallery();

    showSingleCreateView();
}

        /* =========================
           11. 側邊欄收合
        ========================= */

        function toggleSidebar() {
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('active');
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        /* =========================
           12. 圖庫
        ========================= */

        function renderGallery() {
            galleryGrid.innerHTML = '';

            /*
             * 將所有 session 裡的圖片合併成一個陣列。
             * 一個 session 可以有多張圖片。
             */

            const allImages = state.sessions.flatMap(session =>
                (session.images || []).map(image => ({
                    ...image,
                    sessionTitle: session.title || '未命名創作',
                    promptText: session.promptText || ''
                }))
            );

            /*
             * createdAt 越大代表時間越新。
             * 因此使用 b - a，最新圖片排在最前面。
             */

            allImages.sort((a, b) =>
                (Number(b.createdAt) || 0) -
                (Number(a.createdAt) || 0)
            );

            const keyword =
                gallerySearch.value.trim().toLowerCase();

            const filteredImages = allImages.filter(image => {
                const title = image.sessionTitle || '';
                const prompt = image.promptText || '';

                return `${title} ${prompt}`
                    .toLowerCase()
                    .includes(keyword);
            });

            /* 沒有圖片 */

            if (filteredImages.length === 0) {
                const emptyMessage = document.createElement('div');

                emptyMessage.className = 'gallery-empty';

                if (keyword) {
                    emptyMessage.innerHTML = `
                        <i class="fa-solid fa-magnifying-glass"></i>
                        找不到符合搜尋條件的圖片。
                    `;
                } else {
                    emptyMessage.innerHTML = `
                        <i class="fa-regular fa-images"></i>
                        <strong>目前還沒有生成圖片</strong>
                        <p>
                            連接圖片生成 API 並儲存生成結果後，
                            圖片就會自動顯示在這裡。
                        </p>
                    `;
                }

                galleryGrid.appendChild(emptyMessage);
                return;
            }

            /* 建立圖片卡片 */

            filteredImages.forEach(image => {
                const card = document.createElement('article');

                card.className = 'gallery-card';

                const img = document.createElement('img');

                img.src = image.url;
                img.alt = image.sessionTitle;
                img.loading = 'lazy';

                img.onerror = () => {
                    img.alt = '圖片載入失敗';
                };

                const info = document.createElement('div');

                info.className = 'gallery-info';

                const title = document.createElement('strong');
                title.textContent = image.sessionTitle;

                const prompt = document.createElement('p');
                prompt.textContent =
                    image.promptText || '沒有提示詞資料';

                const date = document.createElement('span');

                date.className = 'gallery-date';

                const timestamp = Number(image.createdAt);

                date.textContent = Number.isFinite(timestamp) && timestamp > 0
                    ? new Date(timestamp).toLocaleString('zh-TW')
                    : '建立時間未知';

                info.appendChild(title);
                info.appendChild(prompt);
                info.appendChild(date);

                card.appendChild(img);
                card.appendChild(info);

                galleryGrid.appendChild(card);
            });
        }

        /* =========================
           13. 事件監聽
        ========================= */

        galleryButton.addEventListener('click', () => {
            showGalleryView();
        });

        toggleSidebarButton.addEventListener(
            'click',
            toggleSidebar
        );
        toggleSidebarGalleryButton.addEventListener(
    'click',
    toggleSidebar
);
        gallerySearch.addEventListener(
            'input',
            renderGallery
        );

        /* =========================
           14. 參考圖片上傳
        ========================= */

        referenceImageInput.addEventListener('change', () => {
            const file = referenceImageInput.files[0];

            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('請選擇圖片檔案！');
                referenceImageInput.value = '';
                return;
            }

            if (referenceImageObjectUrl) {
                URL.revokeObjectURL(referenceImageObjectUrl);
            }

            referenceImageObjectUrl =
                URL.createObjectURL(file);

            referenceImagePreview.src =
                referenceImageObjectUrl;

            referenceImageName.textContent =
                file.name;

            referenceImageWrap.hidden = false;
        });

        /* =========================
           15. 移除參考圖片
        ========================= */

        removeReferenceImageButton.addEventListener(
            'click',
            () => {
                if (referenceImageObjectUrl) {
                    URL.revokeObjectURL(
                        referenceImageObjectUrl
                    );

                    referenceImageObjectUrl = null;
                }

                referenceImagePreview.removeAttribute('src');
                referenceImageInput.value = '';
                referenceImageWrap.hidden = true;
            }
        );

        /* =========================
           16. 圖片生成表單
        ========================= */

        singleCreateForm.addEventListener('submit', event => {
            event.preventDefault();

            const promptText = singlePrompt.value.trim();

            /* 先檢查提示詞 */

            if (!promptText) {
                singleCreateStatus.textContent =
                    '請先輸入圖片提示詞。';

                singlePrompt.focus();
                return;
            }

            const selectedRatio =
                singleCreateForm.querySelector(
                    'input[name="aspect-ratio"]:checked'
                );

            if (!selectedRatio) {
                singleCreateStatus.textContent =
                    '請選擇圖片比例。';

                return;
            }

            const currentSession = getCurrentSession();

            if (!currentSession) {
                singleCreateStatus.textContent =
                    '目前沒有可用的創作紀錄。';

                return;
            }

            /*
             * 驗證成功後才更新資料，
             * 避免空白提示詞覆蓋原本的資料。
             */

            currentSession.promptText = promptText;

            const ratio = selectedRatio.value;

            const styleSelect =
                document.getElementById('image-style');

            const styleText =
                styleSelect.options[
                    styleSelect.selectedIndex
                ].textContent;

            const resolution =
                document.getElementById('image-resolution').value;

            const count =
                document.getElementById('image-count').value;

            // 寫入 chat_sessions.json 用的欄位
            currentSession.prompt = promptText;
            currentSession.style = styleText;
            currentSession.proportion = ratio;
            currentSession.resolution = resolution;
            currentSession.num = count;
            currentSession.example = referenceImageInput.files[0]
                ? referenceImageInput.files[0].name
                : '';

            saveState();
            renderSidebar();

            singleCreateStatus.textContent =
                `提示詞已讀取。風格：${styleText}；比例：${ratio}；解析度：${resolution}；數量：${count} 張。目前尚未連接圖片生成模型。`;

            previewState.textContent = '尚未生成';

            /* 保留資料供未來 API 串接 */

            console.log('圖片提示詞：', promptText);
            console.log('圖片比例：', ratio);
            console.log('圖片風格：', styleText);
            console.log('解析度：', resolution);
            console.log('生成數量：', count);
            console.log(
                '參考圖片：',
                referenceImageInput.files[0] || null
            );
        });

        /* =========================
           17. 初始化
        ========================= */

        function init() {
            if (state.sessions.length === 0) {
                createNewSession();
            } else {
                state.currentSessionId =
                    state.sessions[0].id;

                saveState();
            }

            const currentSession = getCurrentSession();

            if (currentSession) {
                singlePrompt.value =
                    currentSession.promptText || '';
            }

            renderSidebar();
            showSingleCreateView();
        }

        init();

    </script>

</body>
