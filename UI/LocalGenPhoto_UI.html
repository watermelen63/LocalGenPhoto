<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 響應式網頁設計設定：確保在手機與平板電腦上呈現正確的比例 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單次圖片生成</title>

  <!-- ==================== 外部第三方套件引入 ==================== -->
  <!-- 1. FontAwesome 圖示庫：提供選單與操作圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* ==================== 全域變數定義 (CSS Variables) ==================== */
    :root {
  --bg-dark: #faf6f0;        /* 主背景：清爽暖米白 */
  --bg-sidebar: #dbcab5;     /* 側邊欄背景：加深燕麥色 (與主背景拉開明顯對比) */
  --bg-card: #ffffff;        /* 卡片與輸入框背景：純白 (突顯層次) */
      --primary: #5c341a;        /* 主要亮點/按鈕：濃郁黑咖啡/深核桃棕 */
  --text-main: #1f140c;      /* 主要文字：極深咖黑 (對比度極高、閱讀最清晰) */
  --text-muted: #5e4d40;     /* 次要文字：中深褐色 */
  --border: #b59f88;         /* 邊框顏色：清晰的暖灰褐色線條 */
}
    

    /* 基本重設 (CSS Reset) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden; /* 防止整個頁面出現外層捲軸 */
    }

    /* ==================== 1. 側邊欄 (Sidebar) 樣式 ==================== */
    #sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.3s ease, transform 0.3s ease; 
      z-index: 100;
    }
    #sidebar.collapsed {
    margin-left: -260px;
    }
    .sidebar-header {
      padding: 16px;
    }

    /* 「新增創作」按鈕 */
    .btn-new-create {
      width: 100%;
      padding: 12px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-new-create:hover {
      background-color: #3b3b52;
    }
    /* =========================
   新增創作模式選單
========================= */

/* 選單預設隱藏 */
.creation-menu {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
}

/* 選單開啟 */
.creation-menu.show {
    display: flex;
}

/* 每個創作選項 */
.creation-option {
    display: flex;
    align-items: center;
    gap: 12px;

    width: 100%;
    padding: 12px;

    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text-main);
    cursor: pointer;
    text-align: left;

    transition: background 0.2s;
}

/* 滑鼠懸停 */
.creation-option:hover {
    background-color: #eee2d4;
}

/* 選項圖示 */
.creation-option > i {
    font-size: 20px;
    color: var(--primary);
}

/* 選項文字 */
.creation-option span {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

/* 標題 */
.creation-option strong {
    font-size: 14px;
}

/* 說明 */
.creation-option small {
    font-size: 12px;
    color: var(--text-muted);
}
    /* 圖片生成歷史紀錄清單 */
    .creation-history {
      flex: 1; /* 佔滿剩餘高度 */
      overflow-y: auto; /* 訊息過多時可垂直滾動 */
      padding: 10px 16px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* 文字過長顯示省略號 */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:hover, .history-item.active {
      background-color: var(--bg-card);
      color: var(--text-main);
    }
    /* 歷史紀錄標題 */
.history-title {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* 歷史紀錄操作按鈕 */
.history-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* 編輯與刪除按鈕預設隱藏 */
.history-actions button {
    display: none;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
}

/* 滑鼠移到創作紀錄時顯示 */
.history-item:hover .history-actions button,
.history-item:focus-within .history-actions button {
    display: inline-flex;
}

.history-actions button:hover {
    color: var(--primary);
}

    /* 刪除按鈕預設隱藏，滑鼠懸停時顯示 */
    .history-item i.delete-btn {
      display: none;
      opacity: 0.7;
    }

    .history-item:hover i.delete-btn {
      display: inline-block;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    .btn-settings {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    /* 圖片生成工作區標題列使用的側邊欄切換按鈕 */
    .menu-toggle {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
      display: block;
    }

    /* ==================== 4. API 設定彈窗 (Modal) 樣式 ==================== */
    .modal {
      display: none; /* 預設隱藏 */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
    }

    .modal-content h3 {
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-secondary, .btn-primary {
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
    }

    .btn-secondary {
      background-color: var(--border);
      color: var(--text-main);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #11111b;
      font-weight: bold;
    }

   /* ==================== 5. 響應式斷點 (Responsive Design) ==================== */

/* 電腦版：側邊欄收合 */
#sidebar.collapsed {
    margin-left: -260px;
}

/* 手機版 */
@media (max-width: 768px) {

    #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        transform: translateX(-100%);
        margin-left: 0;
    }

    /* 手機版展開 */
    #sidebar.active {
        transform: translateX(0);
    }

    /* 避免電腦版的 collapsed 狀態影響手機版 */
    #sidebar.collapsed {
        margin-left: 0;
    }
}
/* ==============================
   單次圖片生成工作區
================================ */

/* 新工作區預設隱藏 */
#single-create-view {
    display: none;
    flex: 1;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg-dark);
}

/* 顯示新工作區 */
#single-create-view.active {
    display: flex;
}


/* ==============================
   頂部標題列
================================ */

.creation-header {
    min-height: 68px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
}

.creation-header-title {
    flex: 1;
    min-width: 0;
}

.creation-eyebrow,
.panel-eyebrow {
    display: block;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
}

.creation-header-title h1 {
    font-size: 19px;
    margin-top: 3px;
}

/* ==============================
   左右主要工作區
================================ */

.single-workspace {
    display: grid;
    grid-template-columns: minmax(300px, 370px) minmax(0, 1fr);
    gap: 20px;

    flex: 1;
    min-height: 0;
    padding: 20px;

    overflow-y: auto;
}


/* 左側設定面板、右側預覽面板 */

.creation-settings-panel,
.preview-panel {
    min-width: 0;
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
}


/* ==============================
   左側生成設定
================================ */

.creation-settings-panel {
    padding: 22px;
    overflow-y: auto;
}

.panel-intro {
    margin-bottom: 24px;
}

.panel-intro h2,
.preview-heading h2 {
    font-size: 20px;
    margin-top: 6px;
}

.panel-intro p {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 7px;
    line-height: 1.6;
}


.field-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
}

.field-group > label {
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;
}


/* 覆蓋原本全域 textarea 設定 */

#single-create-view textarea {
    width: 100%;
    height: auto;
    flex: initial;
    max-height: none;
    min-height: 45px;

    padding: 12px;

    background-color: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text-main);
    font-size: 14px;
    line-height: 1.6;

    resize: vertical;
    outline: none;
}

#single-create-view textarea:focus,
#single-create-view select:focus {
    border-color: var(--primary);
}

#single-create-view textarea::placeholder {
    color: #9a8b7e;
}

.field-hint {
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.5;
}


/* 下拉選單 */

.control-select {
    width: 100%;
    padding: 11px 12px;

    background-color: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text-main);
    font-size: 14px;
    outline: none;
}


/* 分隔線 */

.setting-divider {
    height: 1px;
    background-color: var(--border);
    margin: 22px 0;
}


/* ==============================
   圖片比例選擇
================================ */

.ratio-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.ratio-option {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;

    padding: 10px 4px;

    background-color: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
}

.ratio-option input {
    accent-color: var(--primary);
}

.ratio-option:has(input:checked) {
    background-color: #eee2d4;
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 700;
}


/* 解析度與圖片數量 */

.field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}


/* ==============================
   參考圖片上傳
================================ */

.visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

.upload-dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;

    min-height: 120px;
    padding: 16px;

    background-color: var(--bg-dark);
    border: 1px dashed var(--border);
    border-radius: 10px;

    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.2s;
}

.upload-dropzone:hover {
    background-color: #eee2d4;
}

.upload-dropzone i {
    color: var(--primary);
    font-size: 24px;
}

.upload-dropzone span {
    font-size: 13px;
    font-weight: 600;
}

.upload-dropzone small {
    font-size: 11px;
}


/* 已上傳的參考圖片 */

.reference-preview {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    padding: 10px;

    background-color: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
}

.reference-preview[hidden] {
    display: none;
}

.reference-preview img {
    width: 58px;
    height: 58px;
    object-fit: cover;
    border-radius: 6px;
}

.reference-file-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.reference-file-info span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
}

.reference-file-info button {
    align-self: flex-start;
    padding: 3px 8px;
    color: #a33;
    background: transparent;
    border: none;
    cursor: pointer;
}


/* ==============================
   生成按鈕
================================ */

.btn-generate {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    padding: 14px;

    background-color: var(--primary);
    border: none;
    border-radius: 9px;

    color: white;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
    transition: opacity 0.2s;
}

.btn-generate:hover {
    opacity: 0.88;
}

.creation-status {
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
}


/* ==============================
   右側圖片預覽區
================================ */

.preview-panel {
    display: flex;
    flex-direction: column;
    padding: 22px;
}

.preview-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.preview-state {
    padding: 6px 10px;
    background-color: var(--bg-dark);
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 11px;
    white-space: nowrap;
}


/* 圖片預覽畫布 */

.preview-canvas {
    flex: 1;
    min-height: 420px;

    display: grid;
    place-items: center;

    padding: 24px;

    background: linear-gradient(145deg, #ffffff, #faf6f0);
    border: 1px dashed var(--border);
    border-radius: 12px;
}

.preview-empty-state {
    max-width: 350px;
    text-align: center;
}

.preview-icon {
    width: 76px;
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 18px;

    background-color: #eee2d4;
    border-radius: 20px;

    color: var(--primary);
    font-size: 30px;
}

.preview-empty-state h3 {
    font-size: 17px;
    margin-bottom: 9px;
}

.preview-empty-state p {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.7;
}


/* 預覽區底部 */

.preview-footer {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-top: 16px;

    color: var(--text-muted);
    font-size: 12px;
}


/* ==============================
   響應式設計
================================ */

@media (max-width: 1050px) {

    .single-workspace {
        grid-template-columns: minmax(0, 1fr);
    }

    .preview-canvas {
        min-height: 350px;
    }
}

@media (max-width: 768px) {

    #single-create-view {
        height: 100vh;
    }

    .creation-header {
        padding: 10px 14px;
    }

    .creation-header-title h1 {
        font-size: 16px;
    }

    .single-workspace {
        padding: 12px;
        gap: 14px;
    }

    .creation-settings-panel,
    .preview-panel {
        padding: 16px;
    }

    .preview-canvas {
        min-height: 280px;
    }
}
  </style>
</head>
<body>

  <!-- 1. 左側邊欄區塊 -->
  <div id="sidebar">
    <div class="sidebar-header">

  <!-- 新增創作按鈕 -->
  <button class="btn-new-create" id="btn-new-create">
    <i class="fa-solid fa-plus"></i>
    新增創作
  </button>

  <!-- 創作模式選單 -->
  <div class="creation-menu" id="creation-menu">

    <button class="creation-option" id="btn-single-create">
      <i class="fa-solid fa-image"></i>
      <span>
        <strong>單次生成</strong>
        <small>獨立生成一張圖片</small>
      </span>
    </button>
</div>

</div>
    <!-- 圖片生成歷史紀錄清單，由 JavaScript 動態生成內容 -->
    <div class="creation-history" id="creation-history"></div>
    </div>
  

<!-- ==============================
     單次圖片生成工作區
================================== -->
<section id="single-create-view">

    <!-- 頂部標題列 -->
    <header class="creation-header">

        <button class="menu-toggle" id="btn-toggle-sidebar-create"
                type="button" title="切換側邊欄">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="creation-header-title">
            <span class="creation-eyebrow">IMAGE STUDIO</span>
            <h1>單次圖片生成</h1>
        </div>

      
    </header>


    <!-- 主要工作區 -->
    <div class="single-workspace">

        <!-- 左側：生成設定 -->
        <aside class="creation-settings-panel">

            <form id="single-create-form">

                <div class="panel-intro">
                    <span class="panel-eyebrow">CONFIGURATION</span>
                    <h2>生成設定</h2>
                    <p>調整你想要的圖片內容與輸出條件。</p>
                </div>


                <!-- 提示詞 -->
                <div class="field-group">
                    <label for="single-prompt">圖片提示詞</label>

                    <textarea
                        id="single-prompt"
                        rows="5"
                        placeholder="例如：一座位於森林深處的玻璃建築，陽光穿過樹葉，電影級光影效果..."
                    ></textarea>

                    <small class="field-hint">
                        描述主體、場景、光線、構圖與畫面風格。
                    </small>
                </div>


                
                <!-- 圖片風格 -->
                <div class="field-group">
                    <label for="image-style">圖片風格</label>

                    <select id="image-style" class="control-select">
                        <option value="auto">不指定</option>
                        <option value="realistic">寫實攝影</option>
                        <option value="illustration">插畫</option>
                        <option value="anime">動漫風格</option>
                        <option value="3d">3D 立體風格</option>
                        <option value="watercolor">水彩畫</option>
                        <option value="pixel">像素藝術</option>
                    </select>
                </div>


                <!-- 圖片比例 -->
                <div class="field-group">
                    <label>圖片比例</label>

                    <div class="ratio-grid">

                        <label class="ratio-option">
                            <input type="radio" name="aspect-ratio"
                                   value="1:1" checked>
                            <span>1:1</span>
                        </label>

                        <label class="ratio-option">
                            <input type="radio" name="aspect-ratio"
                                   value="3:4">
                            <span>3:4</span>
                        </label>

                        <label class="ratio-option">
                            <input type="radio" name="aspect-ratio"
                                   value="4:3">
                            <span>4:3</span>
                        </label>

                        <label class="ratio-option">
                            <input type="radio" name="aspect-ratio"
                                   value="16:9">
                            <span>16:9</span>
                        </label>

                    </div>
                </div>


                <!-- 解析度、圖片數量 -->
                <div class="field-grid">

                    <div class="field-group">
                        <label for="image-resolution">解析度</label>

                        <select id="image-resolution"
                                class="control-select">
                            <option value="512">512</option>
                            <option value="768" selected>768</option>
                            <option value="1024">1024</option>
                        </select>
                    </div>


                    <div class="field-group">
                        <label for="image-count">生成數量</label>

                        <select id="image-count"
                                class="control-select">
                            <option value="1">1 張</option>
                            <option value="2">2 張</option>
                            <option value="3">3 張</option>
                            <option value="4">4 張</option>
                        </select>
                    </div>

                </div>


                <!-- 參考圖片 -->
                <div class="field-group">
                    <label>參考圖片（選填）</label>

                    <label for="reference-image-input"
                           class="upload-dropzone">

                        <i class="fa-solid fa-cloud-arrow-up"></i>

                        <span>點擊上傳圖片</span>

                        <small>支援常見圖片格式</small>

                    </label>

                    <input
                        type="file"
                        id="reference-image-input"
                        accept="image/*"
                        class="visually-hidden"
                    >

                    <div class="reference-preview" id="reference-image-wrap"
                         hidden>

                        <img id="reference-image-preview" alt="參考圖片預覽">

                        <div class="reference-file-info">
                            <span id="reference-image-name"></span>

                            <button type="button"
                                    id="remove-reference-image">
                                移除
                            </button>
                        </div>

                    </div>
                </div>


                <!-- 生成按鈕 -->
                <button type="submit" class="btn-generate">

                    <i class="fa-solid fa-wand-magic-sparkles"></i>

                    生成圖片

                </button>


                <!-- 狀態提示 -->
                <p id="single-create-status"
                   class="creation-status"
                   role="status"
                   aria-live="polite">
                    目前尚未連接圖片生成模型。
                </p>

            </form>

        </aside>


        <!-- 右側：圖片預覽 -->
        <section class="preview-panel">

            <div class="preview-heading">

                <div>
                    <span class="panel-eyebrow">OUTPUT</span>
                    <h2>圖片預覽</h2>
                </div>

                <span class="preview-state" id="preview-state">
                    尚未生成
                </span>

            </div>


            <!-- 預覽畫布 -->
            <div class="preview-canvas" id="preview-canvas">

                <div class="preview-empty-state">

                    <div class="preview-icon">
                        <i class="fa-regular fa-image"></i>
                    </div>

                    <h3>圖片將顯示於此</h3>

                    <p>
                        請先在左側輸入提示詞，
                        並調整圖片生成設定。
                    </p>

                </div>

            </div>


            <!-- 底部說明 -->
            <footer class="preview-footer">

                <i class="fa-solid fa-circle-info"></i>

                <span>
                    目前為介面原型，尚未連接圖片生成模型。
                </span>

            </footer>

        </section>

    </div>

</section>

  <!-- ==================== JavaScript 核心邏輯 ==================== -->
<script>
    /*
     * 吳式單次圖片生成
     * 僅保留圖片生成工作區、歷史紀錄及參考圖片預覽。
     * 圖片生成模型尚未串接；送出表單時只會整理設定並顯示狀態。
     */

    // 正規化單次圖片生成紀錄格式
    function normalizeSingleSessions(rawList) {
        if (!Array.isArray(rawList)) {
            return [];
        }

        return rawList
            .filter(session => session && (!session.mode || session.mode === 'single'))
            .map(session => ({
                id: String(session.id || Date.now()),
                mode: 'single',
                title: typeof session.title === 'string' && session.title.trim()
                    ? session.title
                    : '單次生成圖片',
                titleEdited: Boolean(session.titleEdited),
                prompt: session.prompt || '',
                style: session.style || '',
                proportion: session.proportion || '',
                resolution: session.resolution || '',
                num: session.num || '',
                example: session.example || ''
            }));
    }

    // 舊版資料沿用原 localStorage key，作為離線備援。
    function loadSingleSessions() {
        try {
            const stored = JSON.parse(
                localStorage.getItem('gemini_chat_sessions') || '[]'
            );
            return normalizeSingleSessions(stored);
        } catch (error) {
            console.warn('讀取圖片生成紀錄失敗，將建立新紀錄：', error);
            return [];
        }
    }

    const state = {
        sessions: loadSingleSessions(),
        currentSessionId: null
    };

    // DOM 元素
    const sidebar = document.getElementById('sidebar');
    const newCreateButton = document.getElementById('btn-new-create');
    const creationMenu = document.getElementById('creation-menu');
    const singleCreateButton = document.getElementById('btn-single-create');
    const creationHistory = document.getElementById('creation-history');

    const singleCreateView = document.getElementById('single-create-view');
    const toggleSidebarButton = document.getElementById('btn-toggle-sidebar-create');

    const singleCreateForm = document.getElementById('single-create-form');
    const singlePrompt = document.getElementById('single-prompt');

    const referenceImageInput = document.getElementById('reference-image-input');
    const referenceImageWrap = document.getElementById('reference-image-wrap');
    const referenceImagePreview = document.getElementById('reference-image-preview');
    const referenceImageName = document.getElementById('reference-image-name');
    const removeReferenceImageButton = document.getElementById('remove-reference-image');

    const singleCreateStatus = document.getElementById('single-create-status');
    const previewState = document.getElementById('preview-state');

    let referenceImageObjectUrl = null;

    // 儲存歷史紀錄
    // 後端位址（需先啟動 Background/server.py）
    const API_BASE = 'http://127.0.0.1:8000';

    function saveState() {
        localStorage.setItem(
            'gemini_chat_sessions',
            JSON.stringify(state.sessions)
        );

        // 同步寫入後端 PostgreSQL 資料庫（後端沒開時只在主控台警告）
        fetch(`${API_BASE}/sessions`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(state.sessions)
        }).catch(error => {
            console.warn('無法同步寫入 PostgreSQL 後端（後端未啟動？）：', error);
        });
    }

    // 將指定紀錄的設定回填至左側表單
    function applySessionToForm(session) {
        if (!session) return;
        singlePrompt.value = session.prompt || '';

        const styleSelect = document.getElementById('image-style');
        if (styleSelect && session.style) {
            const matched = Array.from(styleSelect.options).find(
                opt => opt.value === session.style || opt.textContent === session.style
            );
            if (matched) styleSelect.value = matched.value;
        }

        if (session.proportion) {
            const ratioInput = singleCreateForm.querySelector(
                `input[name="aspect-ratio"][value="${session.proportion}"]`
            );
            if (ratioInput) ratioInput.checked = true;
        }

        const resSelect = document.getElementById('image-resolution');
        if (resSelect && session.resolution) {
            const matchedRes = Array.from(resSelect.options).find(
                opt => opt.value === String(session.resolution).trim()
            );
            if (matchedRes) resSelect.value = matchedRes.value;
        }

        const countSelect = document.getElementById('image-count');
        if (countSelect && session.num) {
            const matchedCount = Array.from(countSelect.options).find(
                opt => opt.value === String(session.num).trim()
            );
            if (matchedCount) countSelect.value = matchedCount.value;
        }
    }

    // 顯示單次圖片生成工作區
    function showSingleCreateView() {
        singleCreateView.classList.add('active');
        creationMenu.classList.remove('show');

        if (window.innerWidth <= 768) {
            sidebar.classList.remove('active');
        }
    }

    // 建立新的單次圖片生成紀錄
    function createNewSession() {
        const newSession = {
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            mode: 'single',
            title: '單次生成圖片',
            titleEdited: false,
            prompt: '',
            style: '',
            proportion: '',
            resolution: '',
            num: '',
            example: ''
        };

        state.sessions.unshift(newSession);
        state.currentSessionId = newSession.id;

        saveState();
        renderSidebar();

        return newSession;
    }

    // 安全處理歷史紀錄標題，避免 HTML 注入。
    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        })[char]);
    }

    // 顯示圖片生成歷史紀錄
    function renderSidebar() {
        creationHistory.innerHTML = '';

        state.sessions.forEach(session => {
            const item = document.createElement('div');

            item.className = `history-item ${
                session.id === state.currentSessionId ? 'active' : ''
            }`;

            item.innerHTML = `
                <span class="history-title">
                    <i class="fa-solid fa-image"></i>
                    ${escapeHtml(session.title)}
                </span>
                <span class="history-actions">
                    <button type="button" class="rename-btn" title="重新命名"
                            aria-label="重新命名">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button type="button" class="delete-btn" title="刪除紀錄"
                            aria-label="刪除紀錄">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </span>
            `;

            item.addEventListener('click', event => {
                if (event.target.closest('.rename-btn')) {
                    event.stopPropagation();

                    const newTitle = prompt('請輸入新的創作名稱：', session.title);
                    if (newTitle === null) return;

                    const trimmedTitle = newTitle.trim();
                    if (!trimmedTitle) {
                        alert('名稱不能空白！');
                        return;
                    }

                    session.title = trimmedTitle;
                    session.titleEdited = true;
                    saveState();
                    renderSidebar();
                    return;
                }

                if (event.target.closest('.delete-btn')) {
                    event.stopPropagation();
                    deleteSession(session.id);
                    return;
                }

                state.currentSessionId = session.id;
                applySessionToForm(session);
                renderSidebar();
                showSingleCreateView();
            });

            creationHistory.appendChild(item);
        });
    }

    // 刪除圖片生成紀錄
    function deleteSession(id) {
        state.sessions = state.sessions.filter(session => session.id !== id);

        if (state.sessions.length === 0) {
            state.currentSessionId = null;
            createNewSession();
        } else {
            if (state.currentSessionId === id) {
                state.currentSessionId = state.sessions[0].id;
            }

            saveState();
            renderSidebar();
        }

        showSingleCreateView();
    }

    // 切換側邊欄
    function toggleSidebar() {
        if (window.innerWidth <= 768) {
            sidebar.classList.toggle('active');
        } else {
            sidebar.classList.toggle('collapsed');
        }
    }

    // 新增創作：展開僅包含「單次生成」的選單
    newCreateButton.addEventListener('click', () => {
        creationMenu.classList.toggle('show');
    });

    // 建立單次圖片生成紀錄
    singleCreateButton.addEventListener('click', () => {
        createNewSession();
        showSingleCreateView();
    });

    // 圖片工作區的側邊欄按鈕
    toggleSidebarButton.addEventListener('click', toggleSidebar);

    // 選擇參考圖片
    referenceImageInput.addEventListener('change', () => {
        const file = referenceImageInput.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            alert('請選擇圖片檔案！');
            referenceImageInput.value = '';
            return;
        }

        if (referenceImageObjectUrl) {
            URL.revokeObjectURL(referenceImageObjectUrl);
        }

        referenceImageObjectUrl = URL.createObjectURL(file);
        referenceImagePreview.src = referenceImageObjectUrl;
        referenceImageName.textContent = file.name;
        referenceImageWrap.hidden = false;
    });

    // 移除參考圖片
    removeReferenceImageButton.addEventListener('click', () => {
        if (referenceImageObjectUrl) {
            URL.revokeObjectURL(referenceImageObjectUrl);
            referenceImageObjectUrl = null;
        }

        referenceImagePreview.removeAttribute('src');
        referenceImageInput.value = '';
        referenceImageWrap.hidden = true;
    });

    // 單次圖片生成表單
    singleCreateForm.addEventListener('submit', event => {
        event.preventDefault();

        const promptText = singlePrompt.value.trim();
        if (!promptText) {
            singleCreateStatus.textContent = '請先輸入圖片提示詞。';
            singlePrompt.focus();
            return;
        }

        const negativePromptInput = document.getElementById('negative-prompt');
        const negativePrompt = negativePromptInput ? negativePromptInput.value.trim() : '';
        const selectedRatio = singleCreateForm.querySelector(
            'input[name="aspect-ratio"]:checked'
        );

        if (!selectedRatio) {
            singleCreateStatus.textContent = '請選擇圖片比例。';
            return;
        }

        const ratio = selectedRatio.value;
        const styleSelect = document.getElementById('image-style');
        const styleText = styleSelect.options[styleSelect.selectedIndex].textContent;
        const resolution = document.getElementById('image-resolution').value;
        const count = document.getElementById('image-count').value;

        singleCreateStatus.textContent =
            `提示詞已讀取。風格：${styleText}；比例：${ratio}；解析度：${resolution}；數量：${count} 張。`;

        previewState.textContent = '';
        singleCreateStatus.textContent +=
            ' ';

        // 寫入目前創作紀錄，並同步到後端 PostgreSQL 資料庫
        const currentSession = state.sessions.find(
            session => session.id === state.currentSessionId
        );
        if (currentSession) {
            currentSession.prompt = promptText;
            currentSession.style = styleText;
            currentSession.proportion = ratio;
            currentSession.resolution = resolution;
            currentSession.num = count;
            currentSession.example = referenceImageInput.files[0]
                ? referenceImageInput.files[0].name
                : '';
            saveState();
        }

        // 保留資料供後續圖片生成模型串接。
        console.log('圖片提示詞：', promptText);
        console.log('負面提示詞：', negativePrompt);
        console.log('圖片比例：', ratio);
        console.log('圖片風格：', styleText);
        console.log('解析度：', resolution);
        console.log('生成數量：', count);
        console.log('參考圖片：', referenceImageInput.files[0] || null);
    });

    // 啟動：優先從後端 PostgreSQL 載入創作紀錄，失敗時退回 localStorage。
    async function init() {
        try {
            const res = await fetch(`${API_BASE}/sessions`);
            if (res.ok) {
                const remoteSessions = normalizeSingleSessions(await res.json());
                if (remoteSessions.length > 0) {
                    state.sessions = remoteSessions;
                    localStorage.setItem(
                        'gemini_chat_sessions',
                        JSON.stringify(state.sessions)
                    );
                }
            }
        } catch (error) {
            console.warn('無法從 PostgreSQL 後端讀取紀錄，改用本機快取：', error);
        }

        state.sessions = normalizeSingleSessions(state.sessions);

        if (state.sessions.length === 0) {
            createNewSession();
        } else {
            state.currentSessionId = state.sessions[0].id;
            applySessionToForm(state.sessions[0]);
            saveState();
            renderSidebar();
        }

        showSingleCreateView();
    }

    init();
  </script>
</body>
</html>
