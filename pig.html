<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 響應式網頁設計設定：確保在手機與平板電腦上呈現正確的比例 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Web Chat Assistant</title>

  <!-- ==================== 外部第三方套件引入 ==================== -->
  <!-- 1. FontAwesome 圖示庫：提供聊天圖示、齒輪、垃圾桶等圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 2. Highlight.js 程式碼高亮樣式：這裡選擇 github-dark 深色主題 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">

  <style>
    /* ==================== 全域變數定義 (CSS Variables) ==================== */
    :root {
  --bg-dark: #faf6f0;        /* 主背景：清爽暖米白 */
  --bg-sidebar: #dbcab5;     /* 側邊欄背景：加深燕麥色 (與主背景拉開明顯對比) */
  --bg-card: #ffffff;        /* 卡片與輸入框背景：純白 (突顯層次) */
  --bg-chat-user: #c9af96;   /* 使用者氣泡：濃厚奶茶棕 (與 AI 訊息一眼識別) */
  --bg-chat-ai: #ffffff;     /* AI 訊息氣泡：純白底卡片質感 */
  --primary: #5c341a;        /* 主要亮點/按鈕：濃郁黑咖啡/深核桃棕 */
  --text-main: #1f140c;      /* 主要文字：極深咖黑 (對比度極高、閱讀最清晰) */
  --text-muted: #5e4d40;     /* 次要文字：中深褐色 */
  --border: #b59f88;         /* 邊框顏色：清晰的暖灰褐色線條 */
}
    

    /* 基本重設 (CSS Reset) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden; /* 防止整個頁面出現外層捲軸 */
    }

    /* ==================== 1. 側邊欄 (Sidebar) 樣式 ==================== */
    #sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.3s ease, transform 0.3s ease; 
      z-index: 100;
    }
    #sidebar.collapsed {
    margin-left: -260px;
    }
    .sidebar-header {
      padding: 16px;
    }

    /* 「新增對話」按鈕 */
    .btn-new-chat {
      width: 100%;
      padding: 12px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-new-chat:hover {
      background-color: #3b3b52;
    }
    /* =========================
   新增創作模式選單
========================= */

/* 選單預設隱藏 */
.creation-menu {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
}

/* 選單開啟 */
.creation-menu.show {
    display: flex;
}

/* 每個創作選項 */
.creation-option {
    display: flex;
    align-items: center;
    gap: 12px;

    width: 100%;
    padding: 12px;

    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text-main);
    cursor: pointer;
    text-align: left;

    transition: background 0.2s;
}

/* 滑鼠懸停 */
.creation-option:hover {
    background-color: #eee2d4;
}

/* 選項圖示 */
.creation-option > i {
    font-size: 20px;
    color: var(--primary);
}

/* 選項文字 */
.creation-option span {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

/* 標題 */
.creation-option strong {
    font-size: 14px;
}

/* 說明 */
.creation-option small {
    font-size: 12px;
    color: var(--text-muted);
}
    /* 對話歷史紀錄清單 */
    .chat-history {
      flex: 1; /* 佔滿剩餘高度 */
      overflow-y: auto; /* 訊息過多時可垂直滾動 */
      padding: 10px 16px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* 文字過長顯示省略號 */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:hover, .history-item.active {
      background-color: var(--bg-card);
      color: var(--text-main);
    }
    /* 歷史紀錄標題 */
.history-title {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* 歷史紀錄操作按鈕 */
.history-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* 編輯與刪除按鈕預設隱藏 */
.history-actions button {
    display: none;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
}

/* 滑鼠移到對話紀錄時顯示 */
.history-item:hover .history-actions button,
.history-item:focus-within .history-actions button {
    display: inline-flex;
}

.history-actions button:hover {
    color: var(--primary);
}

    /* 刪除按鈕預設隱藏，滑鼠懸停時顯示 */
    .history-item i.delete-btn {
      display: none;
      opacity: 0.7;
    }

    .history-item:hover i.delete-btn {
      display: inline-block;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    .btn-settings {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    /* ==================== 2. 主要對話區域 (Main Content) 樣式 ==================== */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    /* 頂部標題列 */
    .chat-header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    /* 行動裝置上的選單按鈕 */
    .menu-toggle {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
      display: block; /* 桌面端預設隱藏 */
    }

    /* 訊息顯示容器 */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 單筆訊息區塊 */
    .message {
      display: flex;
      gap: 16px;
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    /* 使用者與 AI 頭像 */
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background-color: #ca9ee6;
      color: #11111b;
    }

    .message.ai .avatar {
      background-color: var(--primary);
      color: #11111b;
    }

    /* 訊息內容渲染區域 */
    .message-body {
      flex: 1;
      line-height: 1.6;
      overflow-x: auto;
    }

    .message-body p {
      margin-bottom: 10px;
    }

    /* 程式碼區塊樣式 */
    .message-body pre {
      background-color: #11111b;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      overflow-x: auto;
    }

    /* ==================== 3. 底部輸入框區域 樣式 ==================== */
    .input-container {
      padding: 16px 24px 24px;
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    .input-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    /* 多行輸入框，可自動隨字數擴展高度 */
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1rem;
      resize: none;
      max-height: 200px;
      height: 24px;
      line-height: 1.5;
    }

    .btn-send {
      background-color: var(--primary);
      color: #11111b;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ==================== 4. API 設定彈窗 (Modal) 樣式 ==================== */
    .modal {
      display: none; /* 預設隱藏 */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
    }

    .modal-content h3 {
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-secondary, .btn-primary {
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
    }

    .btn-secondary {
      background-color: var(--border);
      color: var(--text-main);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #11111b;
      font-weight: bold;
    }

   /* ==================== 5. 響應式斷點 (Responsive Design) ==================== */

/* 電腦版：側邊欄收合 */
#sidebar.collapsed {
    margin-left: -260px;
}

/* 手機版 */
@media (max-width: 768px) {

    #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        transform: translateX(-100%);
        margin-left: 0;
    }

    /* 手機版展開 */
    #sidebar.active {
        transform: translateX(0);
    }

    /* 避免電腦版的 collapsed 狀態影響手機版 */
    #sidebar.collapsed {
        margin-left: 0;
    }
}
/* ==============================
   單次圖片生成工作區
================================ */

/* 切換畫面時隱藏原本聊天區 */
#main-content.view-hidden {
    display: none;
}

/* 新工作區預設隱藏 */
#single-create-view {
    display: none;
    flex: 1;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg-dark);
}

/* 顯示新工作區 */
#single-create-view.active {
    display: flex;
}


/* ==============================
   頂部標題列
================================ */

.creation-header {
    min-height: 68px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
}

.creation-header-title {
    flex: 1;
    min-width: 0;
}

.creation-eyebrow,
.panel-eyebrow {
    display: block;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
}

.creation-header-title h1 {
    font-size: 19px;
    margin-top: 3px;
}

.btn-back-to-chat {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-main);
    cursor: pointer;
}

.btn-back-to-chat:hover {
    background-color: #eee2d4;
}


/* ==============================
   左右主要工作區
================================ */

.single-workspace {
    display: grid;
    grid-template-columns: minmax(300px, 370px) minmax(0, 1fr);
    gap: 20px;

    flex: 1;
    min-height: 0;
    padding: 20px;

    overflow-y: auto;
}


/* 左側設定面板、右側預覽面板 */

.creation-settings-panel,
.preview-panel {
    min-width: 0;
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
}


/* ==============================
   左側生成設定
================================ */

.creation-settings-panel {
    padding: 22px;
    overflow-y: auto;
}

.panel-intro {
    margin-bottom: 24px;
}

.panel-intro h2,
.preview-heading h2 {
    font-size: 20px;
    margin-top: 6px;
}

.panel-intro p {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 7px;
    line-height: 1.6;
}


.field-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
}

.field-group > label {
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;
}


/* 覆蓋原本全域 textarea 設定 */

#single-create-view textarea {
    width: 100%;
    height: auto;
    flex: initial;
    max-height: none;
    min-height: 45px;

    padding: 12px;

    background-color: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text-main);
    font-size: 14px;
    line-height: 1.6;

    resize: vertical;
    outline: none;
}

#single-create-view textarea:focus,
#single-create-view select:focus {
    border-color: var(--primary);
}

#single-create-view textarea::placeholder {
    color: #9a8b7e;
}

.field-hint {
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.5;
}


/* 下拉選單 */

.control-select {
    width: 100%;
    padding: 11px 12px;

    background-color: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text-main);
    font-size: 14px;
    outline: none;
}


/* 分隔線 */

.setting-divider {
    height: 1px;
    background-color: var(--border);
    margin: 22px 0;
}


/* ==============================
   圖片比例選擇
================================ */

.ratio-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.ratio-option {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;

    padding: 10px 4px;

    background-color: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
}

.ratio-option input {
    accent-color: var(--primary);
}

.ratio-option:has(input:checked) {
    background-color: #eee2d4;
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 700;
}


/* 解析度與圖片數量 */

.field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}


/* ==============================
   參考圖片上傳
================================ */

.visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

.upload-dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;

    min-height: 120px;
    padding: 16px;

    background-color: var(--bg-dark);
    border: 1px dashed var(--border);
    border-radius: 10px;

    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.2s;
}

.upload-dropzone:hover {
    background-color: #eee2d4;
}

.upload-dropzone i {
    color: var(--primary);
    font-size: 24px;
}

.upload-dropzone span {
    font-size: 13px;
    font-weight: 600;
}

.upload-dropzone small {
    font-size: 11px;
}


/* 已上傳的參考圖片 */

.reference-preview {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    padding: 10px;

    background-color: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
}

.reference-preview[hidden] {
    display: none;
}

.reference-preview img {
    width: 58px;
    height: 58px;
    object-fit: cover;
    border-radius: 6px;
}

.reference-file-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.reference-file-info span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
}

.reference-file-info button {
    align-self: flex-start;
    padding: 3px 8px;
    color: #a33;
    background: transparent;
    border: none;
    cursor: pointer;
}


/* ==============================
   生成按鈕
================================ */

.btn-generate {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    padding: 14px;

    background-color: var(--primary);
    border: none;
    border-radius: 9px;

    color: white;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
    transition: opacity 0.2s;
}

.btn-generate:hover {
    opacity: 0.88;
}

.creation-status {
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
}


/* ==============================
   右側圖片預覽區
================================ */

.preview-panel {
    display: flex;
    flex-direction: column;
    padding: 22px;
}

.preview-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.preview-state {
    padding: 6px 10px;
    background-color: var(--bg-dark);
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 11px;
    white-space: nowrap;
}


/* 圖片預覽畫布 */

.preview-canvas {
    flex: 1;
    min-height: 420px;

    display: grid;
    place-items: center;

    padding: 24px;

    background: linear-gradient(145deg, #ffffff, #faf6f0);
    border: 1px dashed var(--border);
    border-radius: 12px;
}

.preview-empty-state {
    max-width: 350px;
    text-align: center;
}

.preview-icon {
    width: 76px;
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 18px;

    background-color: #eee2d4;
    border-radius: 20px;

    color: var(--primary);
    font-size: 30px;
}

.preview-empty-state h3 {
    font-size: 17px;
    margin-bottom: 9px;
}

.preview-empty-state p {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.7;
}


/* 預覽區底部 */

.preview-footer {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-top: 16px;

    color: var(--text-muted);
    font-size: 12px;
}


/* ==============================
   響應式設計
================================ */

@media (max-width: 1050px) {

    .single-workspace {
        grid-template-columns: minmax(0, 1fr);
    }

    .preview-canvas {
        min-height: 350px;
    }
}

@media (max-width: 768px) {

    #single-create-view {
        height: 100vh;
    }

    .creation-header {
        padding: 10px 14px;
    }

    .creation-header-title h1 {
        font-size: 16px;
    }

    .btn-back-to-chat {
        padding: 8px 10px;
        font-size: 12px;
    }

    .single-workspace {
        padding: 12px;
        gap: 14px;
    }

    .creation-settings-panel,
    .preview-panel {
        padding: 16px;
    }

    .preview-canvas {
        min-height: 280px;
    }
}
  </style>
</head>
<body>

  <!-- 1. 左側邊欄區塊 -->
  <div id="sidebar">

  <script>
    
    /* ==========================================================================
       狀態管理 (State Management)
       負責在記憶體與 localStorage 中維護資料
       ========================================================================== */
     let state = {
    // 本地 AI 的系統指示
    systemPrompt: '你是一個親切且專業的 AI 助手，請使用繁體中文回答。',

    // 對話紀錄
    sessions: JSON.parse(localStorage.getItem('gemini_chat_sessions')) || [],

    // 目前使用的對話 ID
    currentSessionId: null
};

    /* ==========================================================================

    const sidebar = document.getElementById('sidebar');
    const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
    // 單次圖片生成工作區
const mainContent = document.getElementById('main-content');
const singleCreateView = document.getElementById('single-create-view');

const btnBackToChat = document.getElementById('btn-back-to-chat');
const btnToggleSidebarCreate =
    document.getElementById('btn-toggle-sidebar-create');

// 圖片生成表單
const singleCreateForm =
    document.getElementById('single-create-form');

const singlePrompt =
    document.getElementById('single-prompt');

// 參考圖片上傳
const referenceImageInput =
    document.getElementById('reference-image-input');

const referenceImageWrap =
    document.getElementById('reference-image-wrap');

const referenceImagePreview =
    document.getElementById('reference-image-preview');

const referenceImageName =
    document.getElementById('reference-image-name');

const removeReferenceImage =
    document.getElementById('remove-reference-image');

// 狀態文字
const singleCreateStatus =
    document.getElementById('single-create-status');

const previewState =
    document.getElementById('preview-state');

// 暫存參考圖片的網址
let referenceImageObjectUrl = null;
    const btnNewChat = document.getElementById('btn-new-chat');
    const creationMenu = document.getElementById('creation-menu');
const btnSingleCreate = document.getElementById('btn-single-create');
const btnInteractiveCreate = document.getElementById('btn-interactive-create');
    const chatHistoryEl = document.getElementById('chat-history');
    const messagesContainer = document.getElementById('messages-container');
    const userInput = document.getElementById('user-input');
    const btnSend = document.getElementById('btn-send');
    

    /* ==========================================================================
       應用程式初始化 (Initialize)
       ========================================================================== */
    function showSingleCreateView() {

    // 隱藏原本聊天畫面
    mainContent.classList.add('view-hidden');

    // 顯示圖片生成畫面
    singleCreateView.classList.add('active');

    // 收起新增創作選單
    creationMenu.classList.remove('show');

    // 手機版選擇模式後自動收起側邊欄
    if (window.innerWidth <= 768) {
        sidebar.classList.remove('active');
    }
}


// 返回原本聊天畫面
function showChatView() {

    // 隱藏圖片生成畫面
    singleCreateView.classList.remove('active');

    // 顯示原本聊天畫面
    mainContent.classList.remove('view-hidden');

    // 重新渲染目前的對話
    renderMessages();
}
// 根據歷史紀錄類型切換畫面
function showSessionView(session) {

    if (session && session.mode === 'single') {

        // 單次圖片生成
        showSingleCreateView();

    } else {

        // 互動式生成圖片
        showChatView();

    }

}
    function init() {

    // 舊版聊天紀錄統一轉為互動式創作
    state.sessions = state.sessions.map(session => ({
        ...session,
        mode: session.mode === 'single'
            ? 'single'
            : 'interactive'
    }));

    // 沒有任何歷史紀錄時
    if (state.sessions.length === 0) {

        // 自動建立互動式生成圖片
        createNewSession('interactive');

    } else {

        // 確認目前選中的紀錄是否存在
        const exists = state.sessions.some(
            session => session.id === state.currentSessionId
        );

        if (!exists) {
            state.currentSessionId = state.sessions[0].id;
        }

    }

    // 初次渲染
    renderSidebar();
    renderMessages();

    // 恢復目前選中的工作區
    const currentSession = state.sessions.find(
        session => session.id === state.currentSessionId
    );

    showSessionView(currentSession);

    // 輸入框自動調整高度
    userInput.addEventListener('input', () => {

        userInput.style.height = 'auto';

        userInput.style.height =
            `${Math.min(userInput.scrollHeight, 200)}px`;

    });

    // Enter 發送訊息，Shift + Enter 換行
    userInput.addEventListener('keydown', (e) => {

        if (e.key === 'Enter' && !e.shiftKey) {

            e.preventDefault();

            handleSendMessage();

        }

    });

}

    /* ==========================================================================
       對話與 Session 處理邏輯
       ========================================================================== */
    
    // 建立新對話
   // 建立新的創作或對話紀錄
function createNewSession(mode = 'interactive') {
    // 根據創作模式決定預設名稱
    const titles = {
        single: '單次生成圖片',
        interactive: '互動式生成圖片'
    };

    const newSession = {

        id: Date.now().toString(),

        // 記錄這筆資料屬於哪一種模式
        mode: mode,

        // 預設名稱
        title: titles[mode] || '互動式生成圖片',

        // 是否已經手動修改名稱
        titleEdited: false,

        // 對話紀錄
        messages: []

    };

    state.sessions.unshift(newSession);

    state.currentSessionId = newSession.id;

    saveState();

    renderSidebar();

    renderMessages();
}
// 將所有創作與對話紀錄儲存到 localStorage
function saveState() {

    localStorage.setItem(
        'gemini_chat_sessions',
        JSON.stringify(state.sessions)
    );

}

    // 渲染側邊欄歷史紀錄
function renderSidebar() {

    chatHistoryEl.innerHTML = '';

    state.sessions.forEach(session => {

        const item = document.createElement('div');

        // 判斷目前選中的紀錄
        item.className = `history-item ${
            session.id === state.currentSessionId ? 'active' : ''
        }`;

        // 根據模式決定圖示
        const iconClass =
            session.mode === 'single'
                ? 'fa-solid fa-image'
                : session.mode === 'interactive'
                    ? 'fa-solid fa-comments'
                    : 'fa-regular fa-message';

        // 建立歷史紀錄 HTML
        item.innerHTML = `
            <span class="history-title">
                <i class="${iconClass}"></i>
                ${escapeHtml(session.title)}
            </span>

            <span class="history-actions">

                <button type="button"
                        class="rename-btn"
                        title="重新命名">
                    <i class="fa-solid fa-pen"></i>
                </button>

                <button type="button"
                        class="delete-btn"
                        title="刪除紀錄">
                    <i class="fa-solid fa-trash"></i>
                </button>

            </span>
        `;

        // 點擊歷史紀錄
        item.onclick = (e) => {

            // 重新命名
            if (e.target.closest('.rename-btn')) {

                e.stopPropagation();

                const newTitle = prompt(
                    '請輸入新的創作名稱：',
                    session.title
                );

                if (newTitle === null) return;

                const trimmedTitle = newTitle.trim();

                if (!trimmedTitle) {
                    alert('名稱不能空白！');
                    return;
                }

                session.title = trimmedTitle;
                session.titleEdited = true;

                saveState();
                renderSidebar();

                return;
            }

            // 刪除紀錄
            if (e.target.closest('.delete-btn')) {

                e.stopPropagation();

                deleteSession(session.id);

                return;
            }

            // 切換目前紀錄
            state.currentSessionId = session.id;

            renderSidebar();

            // 切換對應畫面
            showSessionView(session);
        };

        chatHistoryEl.appendChild(item);

    });
}

// 刪除歷史紀錄
// 刪除歷史紀錄
function deleteSession(id) {

    // 移除指定紀錄
    state.sessions = state.sessions.filter(
        session => session.id !== id
    );

    // 如果已經沒有紀錄
    if (state.sessions.length === 0) {

        // 自動建立互動式生成圖片
        const newSession = createNewSession('interactive');

        // 顯示互動式創作畫面
        showSessionView(newSession);

        return;
    }

    // 如果刪除的是目前選中的紀錄
    if (state.currentSessionId === id) {
        state.currentSessionId = state.sessions[0].id;
    }

    // 儲存資料
    saveState();

    // 更新側邊欄
    renderSidebar();

    // 找出目前選中的紀錄
    const currentSession = state.sessions.find(
        session => session.id === state.currentSessionId
    );

    // 切換到正確工作區
    showSessionView(currentSession);
}

    // 渲染目前對話框的所有訊息
    function renderMessages() {
      const currentSession = state.sessions.find(s => s.id === state.currentSessionId);
      messagesContainer.innerHTML = '';

      // 若目前為空對話，顯示歡迎提示 UI
      if (!currentSession || currentSession.messages.length === 0) {
        messagesContainer.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); margin-top: 20%;">
            <h2>👋 讓我們一起把想像變成畫面</h2>
            <p style="margin-top: 8px;">告訴我你想呈現的內容，我們可以逐步完善構圖、風格與細節</p>
          </div>
        `;
        return;
      }

      // 依序渲染對話內容
      currentSession.messages.forEach(msg => {
        appendMessageUI(msg.role, msg.content);
      });
      scrollToBottom();
    }

    // 建立單個訊息的 DOM 節點並加入畫面上
    function appendMessageUI(role, content) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      
      const avatarText = role === 'user' ? 'U' : 'AI';
      // 使用 Marked.js 將 AI 輸出的 Markdown 轉為 HTML 結構；使用者輸入則直接轉義 HTML 避免 XSS
      const parsedContent = role === 'ai' ? marked.parse(content) : escapeHtml(content).replace(/\n/g, '<br>');

      msgDiv.innerHTML = `
        <div class="avatar">${avatarText}</div>
        <div class="message-body">${parsedContent}</div>
      `;

      messagesContainer.appendChild(msgDiv);
      
      // 自動對訊息中的程式碼區塊添加高亮效果
      msgDiv.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });
      scrollToBottom();
    }

    // 自動捲動到最底部
    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    /* ==========================================================================
       訊息發送與 API 溝通邏輯
       ========================================================================== */
    async function handleSendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      //// 檢查是否已設定 API Key
      //if (!state.apiKey) {
      //  alert('請先在設定中輸入您的 Gemini API Key！');
      //openSettingsModal();
      //return;
      //}

      const currentSession = state.sessions.find(s => s.id === state.currentSessionId);
      
      // 追加使用者訊息至狀態
      currentSession.messages.push({ role: 'user', content: text });
      
      // 若為首條訊息，自動將其設為對話標題
     if (
    currentSession.messages.length === 1 &&
    !currentSession.titleEdited &&
    (!currentSession.mode || currentSession.mode === 'chat')
) {
    currentSession.title = text.substring(0, 15) +
        (text.length > 15 ? '...' : '');
}

      // 重置輸入框
      userInput.value = '';
      userInput.style.height = 'auto';
      btnSend.disabled = true;

      renderSidebar();
      renderMessages();

      // 在畫面上插入「思考中」載入動畫佔位符
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message ai';
      loadingDiv.innerHTML = `
        <div class="avatar">AI</div>
        <div class="message-body"><i class="fa-solid fa-circle-notch fa-spin"></i> 思考中...</div>
      `;
      messagesContainer.appendChild(loadingDiv);
      scrollToBottom();

      try {
        // 發送 API 請求
        const aiResponse = await callLocalAI(currentSession.messages);
        
        // 將 AI 回應推入對話紀錄
        currentSession.messages.push({ role: 'ai', content: aiResponse });
        saveState();
        renderMessages();
      } catch (err) {
        alert(`請求失敗: ${err.message}`);
        currentSession.messages.pop(); // 請求失敗時復原最後一筆發送
        renderMessages();
      } finally {
        btnSend.disabled = false; // 恢復發送按鈕
      }
    }

    /* =====================================================
   假設呼叫本地端 AI（Ollama）

   API 位址：
   http://127.0.0.1:11434/api/chat

   使用模型：
   qwen3:4b

   ====================================================== */

async function callLocalAI(messages) {

    // 本地端 Ollama API
    const endpoint = 'http://127.0.0.1:11434/api/chat';


    // 建立訊息陣列
    const apiMessages = [];


    // 加入 System Prompt
    if (state.systemPrompt) {
        apiMessages.push({
            role: 'system',
            content: state.systemPrompt
        });
    }


    // 將原本的對話紀錄轉換成 Ollama 格式
    const conversationMessages = messages.map(msg => ({
        role: msg.role === 'user' ? 'user' : 'assistant',
        content: msg.content
    }));
   
    apiMessages.push(...conversationMessages);


    // 發送 HTTP POST 請求
    const response = await fetch(endpoint, {

        method: 'POST',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({

            // 本地端模型名稱
            model: 'qwen3:4b',

            // 傳入完整對話紀錄
            messages: apiMessages,

            // false 代表等待完整回應後才接收 JSON
            stream: false

        })

    });


    // 檢查 API 是否成功
    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data.error || '本地 AI 請求失敗'
        );
    }


    // 取得 AI 回傳的文字
    return data.message.content;

}

 // 選擇參考圖片
referenceImageInput.addEventListener('change', () => {

    const file = referenceImageInput.files[0];

    if (!file) return;

    // 確認是否為圖片
    if (!file.type.startsWith('image/')) {
        alert('請選擇圖片檔案！');
        referenceImageInput.value = '';
        return;
    }

    // 清除先前的圖片網址
    if (referenceImageObjectUrl) {
        URL.revokeObjectURL(referenceImageObjectUrl);
    }

    // 建立圖片預覽網址
    referenceImageObjectUrl = URL.createObjectURL(file);

    // 顯示圖片
    referenceImagePreview.src = referenceImageObjectUrl;

    // 顯示檔案名稱
    referenceImageName.textContent = file.name;

    // 顯示預覽區域
    referenceImageWrap.hidden = false;
});


// 移除參考圖片
removeReferenceImage.onclick = () => {

    if (referenceImageObjectUrl) {
        URL.revokeObjectURL(referenceImageObjectUrl);
    }

    referenceImageObjectUrl = null;

    referenceImagePreview.removeAttribute('src');

    referenceImageInput.value = '';

    referenceImageWrap.hidden = true;
};
// ==============================
// 單次圖片生成表單事件
// ==============================

singleCreateForm.addEventListener('submit', (e) => {

    // 阻止表單預設提交
    e.preventDefault();

    // 取得提示詞
    const promptText = singlePrompt.value.trim();

    if (!promptText) {
        singleCreateStatus.textContent = '請先輸入圖片提示詞。';
        singlePrompt.focus();
        return;
    }

    // 取得負面提示詞
    const negativePrompt =
        document.getElementById('negative-prompt').value.trim();

    // 取得圖片比例
    const ratio = singleCreateForm.querySelector(
        'input[name="aspect-ratio"]:checked'
    ).value;

    // 取得圖片風格
    const style = document.getElementById('image-style');

    const styleText =
        style.options[style.selectedIndex].textContent;

    // 取得解析度
    const resolution =
        document.getElementById('image-resolution').value;

    // 取得生成數量
    const count =
        document.getElementById('image-count').value;

    // 顯示讀取結果
    singleCreateStatus.textContent =
        `提示詞已讀取。風格：${styleText}；比例：${ratio}；解析度：${resolution}；數量：${count} 張。`;

    previewState.textContent = '等待模型連線';

    // 目前尚未連接圖片生成模型
    singleCreateStatus.textContent +=
        ' 尚未連接圖片生成模型，尚未實際生成圖片。';

    // 目前先保留負面提示詞資料供後續模型串接使用
    console.log('負面提示詞：', negativePrompt);

});

    /* 安全工具：避免 XSS 注入攻擊 */
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[m]);
    }

    // 啟動主流程
    init();
  </script>
